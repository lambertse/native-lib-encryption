[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sopack"
version = "0.1.0"
description = "Black-box Android .so encryptor / APK repackager (obfuscation)"
requires-python = ">=3.10"
dependencies = [
    "lief>=0.15",
]

[project.scripts]
sopack = "sopack.cli:main"

[tool.setuptools]
packages = ["sopack"]

[tool.setuptools.package-data]
sopack = ["stubs/*.bin", "stubs/*.json"]
